name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate (lint, test)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --locked --all-features

      - name: Run doctests
        run: cargo test --locked --all-features --doc

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run examples
        run: just examples

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --all-features --no-deps

      # trybuild (the compile_fail test) leaves a nested cargo target dir under
      # target/tests. Remove it so rust-cache's save step does not walk into it
      # and fail with ENOENT.
      - name: Remove trybuild scratch
        if: always()
        run: rm -rf target/tests

  build:
    name: Build (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    needs: [ validate ]
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: no-default-features
            flags: "--no-default-features"
          - name: all-features
            flags: "--all-features"
          - name: hcl
            flags: "--no-default-features --features hcl,derive,color"
          - name: toml
            flags: "--no-default-features --features toml,derive,color"
          - name: serde
            flags: "--no-default-features --features serde"
          - name: layering
            flags: "--no-default-features --features layering"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}

      - name: Build
        run: cargo build -p confval --locked ${{ matrix.features.flags }}

      - name: Test
        run: cargo test -p confval --locked ${{ matrix.features.flags }}
