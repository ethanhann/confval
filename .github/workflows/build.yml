name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  SKIP_NON_UNIT_CRATES: "--exclude confval-derive"

jobs:
  validate:
    name: Validate (lint, test)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --locked --all-features

      - name: Run doctests
        run: cargo test --locked --all-features --doc

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Run examples
        run: just examples

      - name: Feature isolation checks
        run: just check-frontends check-bin check-lsp-example

      - name: Install code quality tools
        run: cargo install cargo-dupes cargo-machete --locked

      - name: Code quality checks
        run: just check-code-quality

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --all-features --no-deps

      # trybuild (the compile_fail test) leaves a nested cargo target dir under
      # target/tests. Remove it so rust-cache's save step does not walk into it
      # and fail with ENOENT.
      - name: Remove trybuild scratch
        if: always()
        run: rm -rf target/tests
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"   # Enables GitHub Actions cache backend
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov \
            --workspace $SKIP_NON_UNIT_CRATES \
            --all-features \
            --ignore-filename-regex 'tests/|examples/' \
            --json --output-path coverage.json

      - name: Generate reports and badges
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex 'tests/|examples/' \
            --html \
            --output-dir coverage-html
          PCT=$(jq '.data[0].totals.lines.percent | . * 10 | floor | . / 10' coverage.json)
          echo "COVERAGE_PCT=${PCT}" >> "$GITHUB_ENV"
          echo "## Coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg pct "$PCT" \
            '{schemaVersion:1,label:"coverage",message:($pct+"%"),color:(if ($pct|tonumber)>=80 then "brightgreen" elif ($pct|tonumber)>=60 then "yellow" else "red" end)}' \
            > coverage-html/badge.json

      - name: Count tests and generate badge
        run: |
          UNIT=$(cargo test --workspace $SKIP_NON_UNIT_CRATES --all-features -- --list 2>/dev/null | grep -c ': test$' || echo 0)
          echo "## Tests: ${UNIT}" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg total "$UNIT" '{schemaVersion:1,label:"tests",message:($total+" passed"),color:"brightgreen"}' \
            > coverage-html/tests-badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/

      # trybuild (the compile_fail test) leaves a nested cargo target dir under
      # target/tests. Remove it so rust-cache's save step does not walk into it
      # and fail with ENOENT.
      - name: Remove trybuild scratch
        if: always()
        run: rm -rf target/tests

  build:
    name: Build (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    needs: [ validate ]
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            flags: ""
          - name: no-default-features
            flags: "--no-default-features"
          - name: all-features
            flags: "--all-features"
          - name: hcl
            flags: "--no-default-features --features hcl,derive,color"
          - name: toml
            flags: "--no-default-features --features toml,derive,color"
          - name: kdl
            flags: "--no-default-features --features kdl,derive,color"
          - name: json
            flags: "--no-default-features --features json,derive,color"
          - name: yaml
            flags: "--no-default-features --features yaml,derive,color"
          - name: serde
            flags: "--no-default-features --features serde"
          - name: layering
            flags: "--no-default-features --features layering"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}

      - name: Build
        run: cargo build -p confval --locked ${{ matrix.features.flags }}

      - name: Test
        run: cargo test -p confval --locked ${{ matrix.features.flags }}

      # trybuild (the compile_fail test) leaves a nested cargo target dir under
      # target/tests. Remove it so rust-cache's save step does not walk into it
      # and fail with ENOENT.
      - name: Remove trybuild scratch
        if: always()
        run: rm -rf target/tests
