hostname: "127.0.0.1"
port: 8080
workers: 8
tls: true
allow:
  - "10.0.0.0/8"
  - "192.168.0.0/16"
headers:
  X-Env: "prod"
  X-Team: "platform"
limits:
  max_body_mb: 64
  mode: "enforce"
upstream:
  - name: api
    host: api.internal
    port: 8080
  - name: web
    host: web.internal
    port: 8081
rules:
  - prefix: "/api"
    upstream: api
  - prefix: "/admin"
    upstream: web
service:
  - name: checkout
    endpoints:
      - name: primary
        port: 9000
    routes:
      - prefix: "/pay"
        endpoint: primary
