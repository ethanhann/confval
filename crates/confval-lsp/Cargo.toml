[package]
name = "confval-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Schema-generic language server core for confval configuration files"
readme = "README.md"
keywords = ["configuration", "lsp", "language-server", "validation"]
categories = ["config", "development-tools"]

[lints]
workspace = true

[dependencies]
confval = { version = "=0.8.0", path = "../confval", features = ["hcl", "toml", "kdl", "json", "yaml"] }
lsp-types = { workspace = true }
lsp-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
line-index = { workspace = true }

[dev-dependencies]
confval = { path = "../confval", features = ["hcl", "toml", "kdl", "json", "yaml", "derive"] }
