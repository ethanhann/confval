[package]
name = "confval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Span-first configuration parsing, validation, and lowering for Rust"
readme.workspace = true
keywords = ["configuration", "validation", "config"]
categories = ["config", "development-tools"]

[package.metadata.docs.rs]
# docs.rs builds with no features by default, which hides every frontend
# module. The list is every public feature except the internal one.
features = ["serde", "color", "hcl", "toml", "kdl", "json", "yaml", "derive", "layering"]

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
color = ["dep:annotate-snippets"]
# Format frontends are independent opt-ins.
# The derive macro emits the format-neutral `FromFields`, so `derive` needs no frontend.
# tldr; pick `hcl`, `toml`, `kdl`, `json`, and/or `yaml` for the format(s) you actually parse.
hcl = ["dep:hcl-edit"]
toml = ["dep:toml_edit"]
kdl = ["dep:kdl"]
json = ["dep:jsonc-parser"]
yaml = ["dep:saphyr-parser"]
derive = ["dep:confval-derive"]
# Assemble one configuration from several layered sources. Combines file
# providers with env and CLI by precedence. Pulls in no external crate.
layering = []
# The reference scope walk, for editor tooling such as confval-lsp. The
# surface is internal and may change in any release.
__internal-navigation = []
# Opt-in profiling. Off by default, so every macro expands to a noop and the
# build pulls in no third-party dependency.
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
annotate-snippets = { workspace = true, optional = true }
hcl-edit = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
kdl = { workspace = true, optional = true }
jsonc-parser = { workspace = true, optional = true }
saphyr-parser = { workspace = true, optional = true }
confval-derive = { version = "=0.9.0", path = "../confval-derive", optional = true }
hotpath = { workspace = true }

[dev-dependencies]
hcl-edit = "0.9.7"
trybuild = "1"

