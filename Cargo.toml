[workspace]
members = [
    "crates/confval",
    "crates/confval-derive",
    "crates/confval-lsp",
]
resolver = "2"


[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ethanhann/confval"
readme = "README.md"

[profile.dev]
opt-level = 0

# A build profile for `cargo mutants`. It drops debug info, so the linker and
# macOS dsymutil do much less work per mutant, and the target directory stays
# small enough to run more parallel jobs.
[profile.mutants]
inherits = "dev"
debug = false

[profile.release]
opt-level = 3               # Maximize performance
debug = true                # Keep debug symbols for profiling
split-debuginfo = "packed"  # Create .dwp alongside the binary
lto = "fat"                 # Link-time optimization
codegen-units = 1           # More aggressive optimization by reducing parallelism
panic = "abort"             # Reduce panic handling code
incremental = false         # Ensure no incremental compilation
overflow-checks = true      # Ensure safer arithmetic operations

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
serde = { version = "1" }
serde_json = { version = "1" }
annotate-snippets = { version = "0.12" }
hcl-edit = { version = "0.9.7" }
toml_edit = { version = "0.25" }
kdl = { version = "6.7", default-features = false, features = ["span"] }
jsonc-parser = { version = "0.33", default-features = false }
saphyr-parser = { version = "0.0.12", default-features = false }
lsp-types = { version = "0.97" }
lsp-server = { version = "0.10" }
line-index = { version = "0.1" }
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn = { version = "3" }
